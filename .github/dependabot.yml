version: 2
updates:
  # Rust dependencies: direct dependencies only, never the gpui tree.
  # SPEC 2.2 forbids a bare `cargo update` because it moves gpui's
  # transitive dependencies; review every lock change against SPEC 2.2.
  - package-ecosystem: "cargo"
    directory: "/"
    allow:
      - dependency-type: "direct"
    ignore:
      # Pinned to a zed git rev by hand (SPEC section 1).
      - dependency-name: "gpui"
      - dependency-name: "gpui_platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"